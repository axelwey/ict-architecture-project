services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - poc4-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  producer:
    image: poc4-producer:latest
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    networks:
      - poc4-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  consumer:
    image: poc4-consumer:latest
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    networks:
      - poc4-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  poc4-net:
    driver: overlay

volumes:
  rabbitmq-data: